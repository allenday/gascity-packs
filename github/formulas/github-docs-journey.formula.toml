description = """
Source-agnostic documentation journey workflow.

Every source adapter supplies a normalized source envelope and immutable
default-branch snapshot. The documentation entry point is navigation, not an
execution root; this formula does not privilege a GitHub issue, pull request,
or operator request.
"""
formula = "github-docs-journey"
version = 1

[vars]
[vars.repository_id]
description = "Immutable GitHub repository node id"
required = true

[vars.repository]
description = "Repository in owner/repo format"
required = true

[vars.installation_id]
description = "GitHub App installation id that owns journey projection"
required = true

[vars.source_kind]
description = "Normalized request source kind, such as github-issue, github-pull-request, or explicit"
required = true

[vars.source_key]
description = "Stable source-adapter key used in durable journey identity"
required = true

[vars.source_url]
description = "Canonical source URL for provenance and optional status projection"
required = true

[vars.docs_impact_source_key]
description = "Exact docs-impact artifact source key authorized as evidence for this journey"
required = true

[vars.documentation_index]
description = "Optional repository-relative documentation entry point; README.md when omitted"
required = false

[vars.default_branch]
description = "Repository default branch at the journey snapshot"
required = true

[vars.default_branch_sha]
description = "Immutable 40-character SHA of the default branch snapshot"
required = true

[vars.techdocs_role]
description = "Required TechDocs reader role"
required = true

[vars.techdocs_job]
description = "Required TechDocs reader job"
required = true

[vars.techdocs_starting_context]
description = "Required TechDocs reader starting context"
required = true

[vars.techdocs_success_condition]
description = "Required TechDocs reader success condition"
required = true

[vars.techdocs_backfill_policy]
description = "Required supplied TechDocs backfill policy"
required = true

[vars.max_depth]
description = "Maximum blocking reader-journey depth"
required = true

[vars.max_children]
description = "Maximum admitted child records"
required = true

[vars.max_docs_prs]
description = "Maximum App-owned documentation pull requests"
required = true

[vars.max_debt_issues]
description = "Maximum recorded non-blocking debt issues"
required = true

[vars.max_elapsed_seconds]
description = "Maximum elapsed seconds for this journey"
required = true

[vars.max_non_progress]
description = "Maximum reconciliations with a pending action and no progress"
required = true

[[steps]]
id = "load-or-create-journey"
title = "Load or create the documentation journey"
description = """
Create or resume the source-bound journey identified by the supplied repository,
normalized source, and default-branch SHA through `scripts/github_docs_journey.py`.
Build the required `techdocs` journey with role, job, starting_context,
success_condition, and backfill_policy exactly as supplied. Set every supplied
budget explicitly; do not substitute defaults.

Reject a missing journey field, malformed source envelope, or snapshot that is
not the supplied immutable default-branch SHA. Pass supplied journey values to
the durable controller, which owns `techdocs` domain and backfill-policy
validation. A source may continue only its existing journey; an unqualified
docs-impact result cannot expand another journey. This lifecycle does not
privilege any source kind.

Invoke `scripts/github_intake_docs_journey_commands.py start-or-admit --once
--input <strict-json>` with exactly `request` and `decision`; the request
contains this normalized source, optional documentation_index, and every
declared journey/budget value, including docs_impact_source_key. Persisted controller output is the only input
to subsequent steps.
"""

[[steps]]
id = "snapshot-and-admit"
title = "Snapshot and mechanically admit one blocking decision"
needs = ["load-or-create-journey"]
description = """
Use the durable journey controller to bind a TechDocs decision to the exact
repository identity, journey identity, qualified decision provenance, and
snapshot SHA. Admit at most one matching blocking decision into one child
record. Never infer reader-journey content: TechDocs decides documentation
content; this formula only enforces the controller's provenance, budgets, and
journey boundary.

A non-blocking decision is debt-only according to the declared backfill policy
and must not invoke the worker.
"""

[[steps]]
id = "project"
title = "Project durable admitted-child intents"
needs = ["snapshot-and-admit"]
description = """
Persist before projecting. Use `scripts/github_intake_docs_journey_commands.py
project-until-settled --once --identity <journey-identity>` to converge only
persisted intents through the configured GitHub App and City adapters. Dispatch
the worker only when its child key appears in `worker_ready_children`: that
means its direct City Bead and Bead assignment are complete. For a v3
pull-request child, create no relay-only GitHub tracking issue. Every deferred
persona-goal-documentation-type coverage cell instead gets exactly one
App-owned, evidence-backed GitHub issue and no Bead or PR. Those issues are
inert: only an explicit `activate-bud` command (or the configured activation
label handler, which invokes that command with a new normalized context) may
start another recursion. A bounded non-convergence is an error, not permission
to dispatch. Do not create resources directly from an unpersisted decision.
"""

[[steps]]
id = "run-admitted-child"
title = "Run the admitted child worker"
needs = ["project"]
description = """
Dispatch `docs-journey` with one admitted child record only after its
direct City Bead and assignment have been durably projected. The worker's
input is the admitted child record, not the source request, event payload, or a
new documentation-impact decision. It returns an IDD-compliant child update
and may prepare at most one App-owned documentation branch with immutable
commit evidence. The controller creates or adopts the one pull request only
after it validates that returned branch evidence.

The worker must read the vendored `managing-issue-driven-development` skill for
lifecycle evidence and the vendored `developer-experience-techdocs` skill for
documentation judgment. The former controls lifecycle work; TechDocs decides
documentation content.
"""

[[steps]]
id = "reconcile"
title = "Reconcile durable journey state"
needs = ["run-admitted-child"]
description = """
Persist the child update through `scripts/github_intake_docs_journey_commands.py
record-child-update --once --input <strict-json>` (exactly `identity` and
`update`), then reconcile the same source-bound journey through the durable
controller. Re-project only persisted pending actions. Do not schedule
new worker work for recorded non-blocking debt. Immediately invoke
`project-until-settled --once --identity <journey-identity>` again to project
the controller-created PR and any terminal-status action. Stop when the
controller returns a terminal state or the current admitted child remains
incomplete.

An operator activates a deferred issue only through
`scripts/github_intake_docs_journey_commands.py activate-bud --once --input
<strict-json>` with the persisted parent identity, bud identity, and a new
normalized context. Creating, updating, assigning, or replaying the issue is
never activation.
"""

[[steps]]
id = "terminal-status"
title = "Project terminal status"
needs = ["reconcile"]
description = """
When the journey reaches `baseline-complete`, `owner-review-required`,
`blocked-on-product-decision`, `budget-exhausted`, or `cancelled`, project its
one durable terminal-status intent through the GitHub App. Do not merge any
documentation pull request; merge authority remains outside this formula.
"""
