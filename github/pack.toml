[pack]
name = "github"
version = "0.1.0"
schema = 2

# The docs-impact reviewer and docs-bootstrap worker are packaged under agents/.
# Both are deliberately opt-in: this pack declares no always-running reviewer,
# bootstrap service, scheduling policy, or event-triggered expansion.

[[service]]
name = "github-webhook"
kind = "proxy_process"
state_root = ".gc/services/github"

[service.publication]
visibility = "public"
hostname = "github"

[service.process]
command = ["python3", "-u", "scripts/github_intake_service.py"]
health_path = "/healthz"

[[service]]
name = "github-admin"
kind = "proxy_process"
state_root = ".gc/services/github"

[service.publication]
visibility = "tenant"
hostname = "github-admin"

[service.process]
command = ["python3", "-u", "scripts/github_intake_service.py"]
health_path = "/healthz"
