[pack]
name = "github"
version = "0.1.0"
schema = 2

# This fixed provider uses the trusted City's existing Codex authentication.
# Neither routed bead content nor sidecar environment can select its model.
[providers.codex-docs-impact]
base = "builtin:codex"
ready_delay_ms = 0
args_append = ["--model", "gpt-5.6-terra", "-c", "model_reasoning_effort=medium"]
options_schema_merge = "by_key"
options_schema = [{ key = "model", omit = true }, { key = "effort", omit = true }]

[providers.codex-docs-impact.env]
GH_TOKEN = ""
GITHUB_TOKEN = ""
GITHUB_APP_ID = ""
GITHUB_APP_PRIVATE_KEY_PEM = ""
GITHUB_WEBHOOK_SECRET = ""

[[service]]
name = "github-webhook"
kind = "proxy_process"
state_root = ".gc/services/github"

[service.publication]
visibility = "public"
hostname = "github"

[service.process]
command = ["python3", "-u", "scripts/github_intake_service.py"]
health_path = "/healthz"

[[service]]
name = "github-admin"
kind = "proxy_process"
state_root = ".gc/services/github"

[service.publication]
visibility = "tenant"
hostname = "github-admin"

[service.process]
command = ["python3", "-u", "scripts/github_intake_service.py"]
health_path = "/healthz"
